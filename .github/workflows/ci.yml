name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip numpy scipy pytest ruff black ty
      - name: Ruff (lint)
        run: ruff check .
      - name: Black (format check — non-blocking; research code is hand-formatted)
        run: black --check . || true
      - name: ty (type check — non-blocking; research code is lightly typed)
        run: ty check . || true
      - name: Pytest
        run: pytest -q
